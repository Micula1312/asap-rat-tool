<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EX CASA — POST 02</title><style>:root{--ink:#050505;--pink:#ff61b6;--acid:#dfff00;--blue:#53b7ff;--panel:#f3f3f0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d8d8;font-family:Helvetica,Arial,sans-serif;color:#050505}#stage{position:fixed;inset:0 360px 0 0;display:flex;align-items:center;justify-content:center;padding:18px}.art{height:min(calc(100vh - 36px),calc((100vw - 396px)*1.25));width:auto;aspect-ratio:4/5;box-shadow:0 0 0 2px #050505}.art canvas{width:100%;height:100%;display:block;cursor:default}.art canvas.dragging{cursor:grabbing}#panel{position:fixed;right:0;top:0;width:360px;height:100vh;overflow:auto;padding:12px 12px 34px;background:var(--panel);border-left:4px solid #050505;box-shadow:-10px 0 0 var(--pink),-14px 0 0 #050505}h1{margin:0;font:900 30px/.86 Helvetica;letter-spacing:-2px;color:#fff;-webkit-text-stroke:2px #050505;text-shadow:3px 3px 0 var(--pink),5px 5px 0 #050505}.sub,.title{display:inline-block;padding:4px 7px;background:var(--acid);border:2px solid #050505;box-shadow:3px 3px 0 #050505;font:900 10px Helvetica;text-transform:uppercase}.section{border-top:3px solid #050505;padding-top:10px;margin-top:15px}.title{background:#050505;color:#fff;box-shadow:3px 3px 0 var(--pink);margin-bottom:8px}.field{margin-bottom:8px}.field label{display:inline-block;margin-bottom:3px;padding:2px 4px;background:#fff;border:1px solid #050505;font:900 9px Helvetica;text-transform:uppercase}.field input{width:100%;border:2px solid #050505;padding:7px 8px;background:#fff;font:800 13px Helvetica}.row,.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette,.emoji{display:flex;flex-wrap:wrap;gap:5px}.swatch,.em{width:32px;height:32px;border:2px solid #050505;background:#fff;cursor:pointer;font-size:18px}.swatch{font-size:0}.em.active{background:var(--acid)}button.action{border:2px solid #050505;background:#fff;padding:10px 8px;font:900 11px Helvetica;box-shadow:4px 4px 0 #050505;cursor:pointer}.primary{background:var(--acid)!important}.blue{background:var(--blue)!important}.pink{background:var(--pink)!important}.hint,.pick-title,.coords{font:900 9px Helvetica;text-transform:uppercase;margin-top:7px}.coords{display:inline-block;padding:3px 5px;background:#fff;border:1px solid #050505}.popup-editor{border:2px solid #050505;background:#fff;padding:7px;margin-bottom:8px;box-shadow:4px 4px 0 #050505}.popup-editor strong{display:inline-block;background:var(--pink);border:2px solid #050505;padding:3px 6px;margin-bottom:6px;font:900 11px Helvetica}.nav{display:flex;gap:6px;margin:10px 0}.nav a{color:#050505;font:900 10px Helvetica;text-decoration:none;border:2px solid #050505;padding:6px;background:#fff}.nav a.active{background:var(--pink)}.check{display:flex;align-items:center;gap:7px;margin:7px 0;font:900 10px Helvetica;text-transform:uppercase}.check input{width:18px;height:18px;accent-color:var(--pink)}</style></head><body><div id="stage"><div class="art"><canvas id="c" width="1080" height="1350"></canvas></div></div><aside id="panel"><h1>POST 02<br>COMPOSER</h1><div class="sub">POPUPS + STROBE / 4:5</div><div class="nav"><a href="index.html">POST 01 · MAPPA</a><a class="active" href="intro.html">POST 02 · STROBO</a></div><div class="section"><div class="title">TESTI</div><div class="field"><label>Titolo</label><input id="headline" value="EX CASA DEL CUSTODE"></div><div class="row"><div class="field"><label>Anno</label><input id="year" value="2026 / 2027"></div><div class="field"><label>Info</label><input id="info" value="GIARDINO DELLA MONTAGNOLA"></div></div><div class="field"><label>Footer</label><input id="footer" value="@excasadelcustode"></div></div><div class="section"><div class="title">3 POPUP</div><div class="popup-editor"><strong>POPUP 01</strong><div class="field"><label>Testo</label><input id="p1" value="UNO SPAZIO CHE RESISTE."></div><span class="coords" id="pos1"></span></div><div class="popup-editor"><strong>POPUP 02</strong><div class="field"><label>Testo</label><input id="p2" value="DATI, CORPI, LUOGHI."></div><span class="coords" id="pos2"></span></div><div class="popup-editor"><strong>POPUP 03</strong><div class="field"><label>Testo</label><input id="p3" value="EX CASA DEL CUSTODE."></div><span class="coords" id="pos3"></span></div><div class="hint">COMPOSE: trascina direttamente i popup sul post</div><div class="field"><label>Scala popup</label><input id="popupScale" type="range" min=".5" max="2.5" step=".05" value="2"></div><div class="field"><label>Intervallo apparizione</label><input id="popupGap" type="range" min="400" max="2200" step="100" value="900"></div></div><div class="section"><div class="title">STRISCE</div><label class="check"><input id="tickerOn" type="checkbox" checked> VISUALIZZA</label><div class="field"><label>Sopra →</label><input id="tickerTop" value="EX CASA DEL CUSTODE"></div><div class="field"><label>Sotto ←</label><input id="tickerBottom" value="ASAP — CUSTODIA — BOLOGNA — ALTRI NOMI"></div><div class="field"><label>Velocità</label><input id="tickerSpeed" type="range" min="20" max="220" value="85"></div></div><div class="section"><div class="title">FINALE STROBO</div><div class="pick-title">ICONA A</div><div class="emoji" id="emojiA"></div><div class="pick-title">ICONA B</div><div class="emoji" id="emojiB"></div><div class="field"><label>Scala</label><input id="scale" type="range" min=".35" max="1.5" step=".05" value="1"></div><div class="field"><label>Velocità strobo</label><input id="speed" type="range" min="55" max="500" step="5" value="120"></div><div class="field"><label>Durata totale</label><input id="duration" type="range" min="5" max="15" value="9"></div><div class="actions"><button class="action pink" id="preview">▶ PLAY</button><button class="action primary" id="rec">● REC</button></div></div><div class="section"><div class="title">SFONDO</div><div class="palette" id="palette"></div></div><div class="section"><div class="title">LOGHI</div><div class="field"><label>Logo 1</label><input class="logo" data-i="0" type="file" accept="image/*"></div><div class="field"><label>Logo 2</label><input class="logo" data-i="1" type="file" accept="image/*"></div><div class="field"><label>Logo 3</label><input class="logo" data-i="2" type="file" accept="image/*"></div><div class="field"><label>ARCI</label><input id="arci" type="file" accept="image/*"></div></div><div class="section"><div class="title">EXPORT</div><div class="actions"><button class="action blue" id="folder">CARTELLA</button><button class="action primary" id="save">PNG</button></div><div class="hint" id="status">OUTPUT: DOWNLOADS</div></div></aside><script>
const W=1080,H=1350,c=document.getElementById('c'),x=c.getContext('2d'),BG=['#8D8D8A','#F1E9FF','#91C792','#FFF1CE','#CFE8FF','#FFD7EA','#0B0B0F'],EM=['🐀','🕳️','🌳','⛲️','🏡','🛝','🎪','🎡','🌟','💦','♥'],$=id=>document.getElementById(id);const s={bg:BG[1],a:'🐀',b:'🌟',logos:[null,null,null],arci:null,dir:null,playing:false,started:0,popupPos:[{x:610,y:250},{x:120,y:535},{x:600,y:850}],drag:-1,dragDX:0,dragDY:0};
function dots(){x.save();x.fillStyle='rgba(5,5,5,.24)';const cx=540,cy=660,st=24;function dot(a,b,r=2.4){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}[168,264,360].forEach(r=>{for(let q=cx-r;q<=cx+r;q+=st){dot(q,cy-r);dot(q,cy+r)}for(let q=cy-r+st;q<cy+r;q+=st){dot(cx-r,q);dot(cx+r,q)}});for(let d=-360;d<=360;d+=st){dot(cx+d,cy,2);dot(cx,cy+d,2)}for(let d=-264;d<=264;d+=st){dot(cx+d,cy+d,1.8);dot(cx+d,cy-d,1.8)}x.restore()}
function identity(){x.textAlign='left';x.textBaseline='top';x.font='bold 42px Helvetica';x.fillStyle='#ff61b6';x.fillText($('headline').value,61,72);x.strokeStyle='#050505';x.lineWidth=5;x.fillStyle='#fff';x.strokeText($('headline').value,55,66);x.fillText($('headline').value,55,66);x.fillStyle='#050505';x.font='bold 28px Helvetica';x.fillText($('year').value,57,117);x.font='bold 12px Helvetica';x.fillText($('info').value,58,155);x.textBaseline='bottom';x.fillText($('footer').value,55,H-72)}
function popupBounds(i){const S=+$('popupScale').value,w=300,h=180,p=s.popupPos[i];return{left:p.x+w/2-w*S/2,top:p.y+h/2-h*S/2,w:w*S,h:h*S}}
function popup(txt,i,a=1){const p=s.popupPos[i],w=300,h=180,S=+$('popupScale').value*a;x.save();x.translate(p.x+w/2,p.y+h/2);x.scale(S,S);x.translate(-w/2,-h/2);x.fillStyle='#F5F5F7';x.strokeStyle='rgba(0,0,0,.18)';x.lineWidth=1;x.beginPath();x.roundRect(0,0,w,h,15);x.fill();x.stroke();x.fillStyle='#ECECEF';x.beginPath();x.roundRect(0,0,w,32,[15,15,0,0]);x.fill();x.fillStyle='rgba(0,0,0,.40)';[17,31,45].forEach(q=>{x.beginPath();x.arc(q,16,4.5,0,Math.PI*2);x.fill()});x.fillStyle='#050505';x.textAlign='left';x.textBaseline='top';x.font='14px Helvetica,Arial,sans-serif';wrapText(txt||'',15,62,w-30,22);x.restore()}
function wrapText(txt,px,py,maxW,lineH){const words=String(txt).split(/\s+/);let line='',yy=py;for(const word of words){const test=line?line+' '+word:word;if(x.measureText(test).width>maxW&&line){x.fillText(line,px,yy);line=word;yy+=lineH}else line=test}if(line)x.fillText(line,px,yy)}
function popupEase(v){const q=Math.max(0,Math.min(1,v)),c1=1.70158,c3=c1+1;return 1+c3*Math.pow(q-1,3)+c1*Math.pow(q-1,2)}
function ticker(txt,y,dir,now){x.save();x.fillStyle='#050505';x.fillRect(0,y,W,58);x.font='900 27px Helvetica';x.fillStyle='#fff';x.textBaseline='middle';const unit=(txt||'—')+'   ✦   ',tw=Math.max(120,x.measureText(unit).width),off=((now/1000*+$('tickerSpeed').value)%tw+tw)%tw;for(let q=-tw*2;q<W+tw*2;q+=tw)x.fillText(unit,q+(dir>0?off:-off),y+29);x.restore()}
function imgFit(i,cx,cy,m){let r=Math.min(m/i.width,m/i.height);x.drawImage(i,cx-i.width*r/2,cy-i.height*r/2,i.width*r,i.height*r)}
function render(){const now=performance.now(),elapsed=s.playing?now-s.started:0,gap=+$('popupGap').value,finalAt=gap*3+900,strobo=s.playing&&elapsed>=finalAt,ph=strobo?Math.floor((elapsed-finalAt)/(+$('speed').value)):0;x.fillStyle=s.bg;x.fillRect(0,0,W,H);dots();identity();x.textAlign='center';x.textBaseline='middle';x.font=`${430*+$('scale').value}px Arial`;x.fillStyle='#050505';x.fillText(strobo&&ph%2?s.b:s.a,W/2,650);if(strobo&&ph%2){x.save();x.globalAlpha=.22;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.restore()}const vals=[$('p1').value,$('p2').value,$('p3').value];for(let i=0;i<3;i++){let show=!s.playing||elapsed>=gap*(i+1);if(show){const a=!s.playing||strobo?1:popupEase((elapsed-gap*(i+1))/260);popup(vals[i],i,a)}}const xs=[795,885,975];for(let i=0;i<3;i++){x.beginPath();x.fillStyle='#fff';x.strokeStyle='#050505';x.arc(xs[i],1250,33,0,Math.PI*2);x.fill();x.stroke();if(s.logos[i])imgFit(s.logos[i],xs[i],1250,45);else{x.font='38px Arial';x.fillStyle='#050505';x.fillText('🌟',xs[i],1250)}}if(s.arci)imgFit(s.arci,982,105,90);else{x.font='76px Arial';x.fillStyle='#050505';x.fillText('★',982,105)}if($('tickerOn').checked){ticker($('tickerTop').value,0,1,now);ticker($('tickerBottom').value,H-58,-1,now)}requestAnimationFrame(render)}
function canvasPoint(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function updateCoords(){s.popupPos.forEach((p,i)=>{$('pos'+(i+1)).textContent=`x ${Math.round(p.x)} · y ${Math.round(p.y)}`})}updateCoords();
c.addEventListener('pointerdown',e=>{if(s.playing)return;const m=canvasPoint(e);for(let i=2;i>=0;i--){const b=popupBounds(i);if(m.x>=b.left&&m.x<=b.left+b.w&&m.y>=b.top&&m.y<=b.top+b.h){s.drag=i;s.dragDX=m.x-s.popupPos[i].x;s.dragDY=m.y-s.popupPos[i].y;c.classList.add('dragging');c.setPointerCapture(e.pointerId);break}}});c.addEventListener('pointermove',e=>{if(s.drag<0)return;const m=canvasPoint(e),p=s.popupPos[s.drag];p.x=Math.max(-80,Math.min(W-80,m.x-s.dragDX));p.y=Math.max(58,Math.min(H-116,m.y-s.dragDY));updateCoords()});function endDrag(e){s.drag=-1;c.classList.remove('dragging');try{c.releasePointerCapture(e.pointerId)}catch(_){}}c.addEventListener('pointerup',endDrag);c.addEventListener('pointercancel',endDrag);
function picker(id,k){EM.forEach(v=>{const b=document.createElement('button');b.className='em';b.textContent=v;b.onclick=()=>{s[k]=v;[...$(id).children].forEach(z=>z.classList.toggle('active',z.textContent===v))};$(id).appendChild(b)});[...$(id).children].forEach(z=>z.classList.toggle('active',z.textContent===s[k]))}picker('emojiA','a');picker('emojiB','b');BG.forEach(v=>{const b=document.createElement('button');b.className='swatch';b.style.background=v;b.onclick=()=>s.bg=v;$('palette').appendChild(b)});function load(inp,cb){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>cb(im);im.src=e.target.result};r.readAsDataURL(f)}document.querySelectorAll('.logo').forEach(i=>i.onchange=()=>load(i,m=>s.logos[+i.dataset.i]=m));$('arci').onchange=()=>load($('arci'),m=>s.arci=m);$('preview').onclick=()=>{s.playing=!s.playing;s.started=performance.now();$('preview').textContent=s.playing?'■ STOP':'▶ PLAY'};$('folder').onclick=async()=>{if(!window.showDirectoryPicker)return;try{s.dir=await showDirectoryPicker({mode:'readwrite'});$('status').textContent='OUTPUT: '+s.dir.name}catch(e){}};async function saveBlob(b,n){if(s.dir){const f=await s.dir.getFileHandle(n,{create:true}),w=await f.createWritable();await w.write(b);await w.close();return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}$('save').onclick=()=>c.toBlob(b=>saveBlob(b,'ex-casa-post02-'+Date.now()+'.png'));$('rec').onclick=()=>{const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',r=new MediaRecorder(c.captureStream(60),{mimeType:mime}),ch=[];r.ondataavailable=e=>e.data.size&&ch.push(e.data);r.onstop=()=>saveBlob(new Blob(ch,{type:mime}),'ex-casa-post02-'+Date.now()+'.webm');s.playing=true;s.started=performance.now();r.start();$('status').textContent='● REC';setTimeout(()=>{r.stop();s.playing=false;$('status').textContent='✓ REC'},+$('duration').value*1000)};render();
</script></body></html>
