<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EX CASA — INTRO POST COMPOSER</title>
<style>
:root{--ink:#050505;--pink:#ff61b6;--acid:#dfff00;--blue:#53b7ff;--panel:#f3f3f0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d8d8;font-family:Helvetica,Arial,sans-serif;color:var(--ink)}#stage{position:fixed;inset:0 360px 0 0;display:flex;align-items:center;justify-content:center;padding:18px}.art{width:min(calc((100vh - 36px)*.8),calc(100vw - 396px));aspect-ratio:4/5;box-shadow:0 0 0 2px #050505}.art canvas{width:100%;height:100%;display:block}#panel{position:fixed;right:0;top:0;width:360px;height:100vh;overflow:auto;padding:12px 12px 34px;background:var(--panel);border-left:4px solid var(--ink);box-shadow:-10px 0 0 var(--pink),-14px 0 0 var(--ink)}h1{margin:0 0 5px;font:900 30px/.86 Helvetica,Arial,sans-serif;letter-spacing:-2px;text-transform:uppercase;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--ink)}.sub,.title{display:inline-block;padding:4px 7px;background:var(--acid);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:900 10px/1 Helvetica,Arial,sans-serif;text-transform:uppercase}.section{border-top:3px solid var(--ink);padding-top:10px;margin-top:15px}.title{background:#050505;color:#fff;box-shadow:3px 3px 0 var(--pink);margin-bottom:8px}.field{margin-bottom:8px}.field label{display:inline-block;margin-bottom:3px;padding:2px 4px;background:#fff;border:1px solid #050505;font:900 9px/1 Helvetica,Arial,sans-serif;text-transform:uppercase}.field input,.field textarea{width:100%;border:2px solid #050505;padding:7px 8px;background:#fff;font:800 13px/1.05 Helvetica,Arial,sans-serif;outline:none}.field textarea{min-height:48px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette,.emoji{display:flex;flex-wrap:wrap;gap:5px}.swatch,.em{width:32px;height:32px;border:2px solid #050505;background:#fff;cursor:pointer;font-size:18px}.swatch{font-size:0}.em.active{background:var(--acid)}button.action{border:2px solid #050505;background:#fff;padding:10px 8px;font:900 11px/1 Helvetica,Arial,sans-serif;text-transform:uppercase;box-shadow:4px 4px 0 #050505;cursor:pointer}.primary{background:var(--acid)!important}.blue{background:var(--blue)!important}.pink{background:var(--pink)!important}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.hint{margin-top:7px;font:800 9px/1.2 Helvetica,Arial,sans-serif;text-transform:uppercase}.nav{display:flex;gap:6px;margin:10px 0}.nav a{color:#050505;font:900 10px/1 Helvetica,Arial,sans-serif;text-decoration:none;border:2px solid #050505;padding:6px;background:#fff}.nav a.active{background:var(--pink)}.pick-title{font:900 9px/1 Helvetica,Arial,sans-serif;margin:7px 0 4px}.range-value{font-size:10px;font-weight:900}
</style></head><body><div id="stage"><div class="art"><canvas id="c" width="1080" height="1350"></canvas></div></div><aside id="panel"><h1>INTRO POST<br>COMPOSER</h1><div class="sub">STATIC + STROBE / 4:5</div><div class="nav"><a href="index.html">ANIMAZIONE</a><a class="active" href="intro.html">POST INTRO</a></div>
<div class="section"><div class="title">TESTI</div><div class="field"><label>Titolo</label><input id="headline" value="EX CASA DEL CUSTODE"></div><div class="row"><div class="field"><label>Anno</label><input id="year" value="2026 / 2027"></div><div class="field"><label>Info</label><input id="info" value="GIARDINO DELLA MONTAGNOLA"></div></div><div class="field"><label>Stringa finale</label><input id="caption" value="2026 edition"></div><div class="field"><label>Footer</label><input id="footer" value="@excasadelcustode"></div></div>
<div class="section"><div class="title">STROBO TRA 2 ICONE</div><div class="pick-title">ICONA A</div><div class="emoji" id="emojiA"></div><div class="pick-title">ICONA B</div><div class="emoji" id="emojiB"></div><div class="field"><label>Scala icona</label><input id="scale" type="range" min=".35" max="1.5" step=".05" value="1"></div><div class="field"><label>Posizione verticale</label><input id="posY" type="range" min="300" max="1000" step="10" value="650"></div><div class="field"><label>Velocità strobo <span class="range-value" id="speedV">120 ms</span></label><input id="speed" type="range" min="55" max="500" step="5" value="120"></div><div class="field"><label>Durata REC <span class="range-value" id="durationV">6 s</span></label><input id="duration" type="range" min="2" max="15" step="1" value="6"></div><div class="actions"><button class="action pink" id="preview">PLAY STROBO</button><button class="action primary" id="rec">REC WEBM</button></div></div>
<div class="section"><div class="title">SFONDO</div><div class="palette" id="palette"></div></div><div class="section"><div class="title">LOGHI</div><div class="field"><label>Logo 1 PNG</label><input class="logo" data-i="0" type="file" accept="image/*"></div><div class="field"><label>Logo 2 PNG</label><input class="logo" data-i="1" type="file" accept="image/*"></div><div class="field"><label>Logo 3 PNG</label><input class="logo" data-i="2" type="file" accept="image/*"></div><div class="field"><label>Stella / logo ARCI alto destra</label><input id="arci" type="file" accept="image/*"></div></div><div class="section"><div class="title">EXPORT</div><div class="actions"><button class="action blue" id="folder">SCEGLI CARTELLA</button><button class="action primary" id="save">SALVA PNG</button></div><div class="hint" id="status">OUTPUT: DOWNLOADS</div></div></aside>
<script>
const W=1080,H=1350,c=document.getElementById('c'),x=c.getContext('2d'),BG=['#8D8D8A','#F1E9FF','#91C792','#FFF1CE','#CFE8FF','#FFD7EA','#0B0B0F'],EM=['🐀','🕳️','🌳','⛲️','🏡','🛝','🎪','🎡','🌟','💦','♥'];
const s={bg:BG[1],a:'🐀',b:'🌟',logos:[null,null,null],arci:null,dir:null,playing:false,started:0};
function grid(){x.save();x.strokeStyle='rgba(5,5,5,.10)';x.lineWidth=1;for(let q=0;q<=W;q+=24){x.beginPath();x.moveTo(q,0);x.lineTo(q,H);x.stroke()}for(let q=0;q<=H;q+=24){x.beginPath();x.moveTo(0,q);x.lineTo(W,q);x.stroke()}x.restore()}
function imgFit(img,cx,cy,max){const r=Math.min(max/img.width,max/img.height);x.drawImage(img,cx-img.width*r/2,cy-img.height*r/2,img.width*r,img.height*r)}
function identity(){const dark=/^#0B/i.test(s.bg),ink=dark?'#fff':'#050505';x.textAlign='left';x.textBaseline='top';x.font='bold 42px Helvetica,Arial,sans-serif';x.fillStyle='#ff61b6';x.fillText(headline.value,61,35);x.strokeStyle='#050505';x.lineWidth=5;x.fillStyle='#fff';x.strokeText(headline.value,55,29);x.fillText(headline.value,55,29);x.strokeStyle='transparent';x.fillStyle=ink;x.font='bold 28px Helvetica,Arial,sans-serif';x.fillText(year.value,57,80);x.font='bold 12px Helvetica,Arial,sans-serif';x.fillText(info.value,58,118);x.textBaseline='bottom';x.fillText(footer.value,55,H-26)}
function draw(){x.fillStyle=s.bg;x.fillRect(0,0,W,H);grid();identity();const now=performance.now(),speed=+document.getElementById('speed').value,icon=s.playing&&Math.floor((now-s.started)/speed)%2?s.b:s.a,py=+posY.value,sc=+scale.value;x.textAlign='center';x.textBaseline='middle';x.font=`${Math.round(430*sc)}px Arial`;x.fillStyle='#050505';x.fillText(icon,W/2,py);x.font='italic 38px Times New Roman';x.fillText(caption.value,W/2,py+260*sc);const xs=[795,885,975],ly=1297;for(let i=0;i<3;i++){x.beginPath();x.fillStyle='#fff';x.strokeStyle='#050505';x.lineWidth=2;x.arc(xs[i],ly,33,0,Math.PI*2);x.fill();x.stroke();if(s.logos[i])imgFit(s.logos[i],xs[i],ly,45);else{x.font='38px Arial';x.fillStyle='#050505';x.fillText('🌟',xs[i],ly)}}if(s.arci)imgFit(s.arci,982,76,90);else{x.font='76px Arial';x.fillStyle='#050505';x.fillText('★',982,76)}requestAnimationFrame(draw)}
function load(input,cb){const f=input.files[0];if(!f)return;const r=new FileReader;r.onload=e=>{const im=new Image;im.onload=()=>cb(im);im.src=e.target.result};r.readAsDataURL(f)}
function picker(id,key){const el=document.getElementById(id);EM.forEach(v=>{const b=document.createElement('button');b.className='em';b.textContent=v;b.onclick=()=>{s[key]=v;[...el.children].forEach(z=>z.classList.toggle('active',z.textContent===v))};el.appendChild(b)});[...el.children].forEach(z=>z.classList.toggle('active',z.textContent===s[key]))}picker('emojiA','a');picker('emojiB','b');BG.forEach(v=>{const b=document.createElement('button');b.className='swatch';b.style.background=v;b.onclick=()=>s.bg=v;palette.appendChild(b)});document.querySelectorAll('.logo').forEach(i=>i.onchange=()=>load(i,img=>s.logos[+i.dataset.i]=img));arci.onchange=()=>load(arci,img=>s.arci=img);speed.oninput=()=>speedV.textContent=speed.value+' ms';duration.oninput=()=>durationV.textContent=duration.value+' s';preview.onclick=()=>{s.playing=!s.playing;s.started=performance.now();preview.textContent=s.playing?'STOP STROBO':'PLAY STROBO'};
folder.onclick=async()=>{if(!window.showDirectoryPicker)return alert('Usa Chrome/Edge oppure i file andranno in Download.');try{s.dir=await showDirectoryPicker({mode:'readwrite'});status.textContent='OUTPUT: '+s.dir.name}catch(e){}};async function saveBlob(blob,name){if(s.dir){try{const f=await s.dir.getFileHandle(name,{create:true}),w=await f.createWritable();await w.write(blob);await w.close();return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}save.onclick=()=>c.toBlob(b=>saveBlob(b,'ex-casa-intro-'+Date.now()+'.png'),'image/png');
rec.onclick=()=>{try{if(!c.captureStream||typeof MediaRecorder==='undefined')throw Error('REC non supportata');const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',stream=c.captureStream(60),r=new MediaRecorder(stream,{mimeType:mime}),chunks=[];r.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};r.onstop=async()=>{const blob=new Blob(chunks,{type:mime});await saveBlob(blob,'ex-casa-intro-strobe-'+Date.now()+'.webm');status.textContent='✓ REC STROBO SALVATA'};s.playing=true;s.started=performance.now();r.start(250);status.textContent='● REC STROBO';rec.disabled=true;setTimeout(()=>{r.requestData();r.stop();s.playing=false;rec.disabled=false},+duration.value*1000)}catch(e){status.textContent='REC ERROR: '+e.message}};draw();
</script></body></html>
