<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EX CASA — POST 02</title>
    <style>
      :root {
        --ink: #050505;
        --pink: #ff61b6;
        --acid: #dfff00;
        --blue: #53b7ff;
        --panel: #f3f3f0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #d8d8d8;
        font-family: Helvetica, Arial, sans-serif;
        color: #050505;
      }
      #stage {
        position: fixed;
        inset: 0 360px 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
      }
      .art {
        height: min(calc(100vh - 36px), calc((100vw - 396px) * 1.25));
        width: auto;
        aspect-ratio: 4/5;
        box-shadow: 0 0 0 2px #050505;
      }
      .art canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel {
        position: fixed;
        right: 0;
        top: 0;
        width: 360px;
        height: 100vh;
        overflow: auto;
        padding: 12px 12px 34px;
        background: var(--panel);
        border-left: 4px solid #050505;
        box-shadow:
          -10px 0 0 var(--pink),
          -14px 0 0 #050505;
      }
      h1 {
        margin: 0;
        font: 900 30px/0.86 Helvetica;
        letter-spacing: -2px;
        color: #fff;
        -webkit-text-stroke: 2px #050505;
        text-shadow:
          3px 3px 0 var(--pink),
          5px 5px 0 #050505;
      }
      .sub,
      .title {
        display: inline-block;
        padding: 4px 7px;
        background: var(--acid);
        border: 2px solid #050505;
        box-shadow: 3px 3px 0 #050505;
        font: 900 10px Helvetica;
        text-transform: uppercase;
      }
      .section {
        border-top: 3px solid #050505;
        padding-top: 10px;
        margin-top: 15px;
      }
      .title {
        background: #050505;
        color: #fff;
        box-shadow: 3px 3px 0 var(--pink);
        margin-bottom: 8px;
      }
      .field {
        margin-bottom: 8px;
      }
      .field label {
        display: inline-block;
        margin-bottom: 3px;
        padding: 2px 4px;
        background: #fff;
        border: 1px solid #050505;
        font: 900 9px Helvetica;
        text-transform: uppercase;
      }
      .field input,
      .field textarea {
        width: 100%;
        border: 2px solid #050505;
        padding: 7px 8px;
        background: #fff;
        font: 800 13px Helvetica;
      }
      .field textarea {
        min-height: 58px;
        resize: vertical;
      }
      .row,
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .palette,
      .emoji {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .swatch,
      .em {
        width: 32px;
        height: 32px;
        border: 2px solid #050505;
        background: #fff;
        cursor: pointer;
        font-size: 18px;
      }
      .swatch {
        font-size: 0;
      }
      .em.active {
        background: var(--acid);
      }
      button.action {
        border: 2px solid #050505;
        background: #fff;
        padding: 10px 8px;
        font: 900 11px Helvetica;
        box-shadow: 4px 4px 0 #050505;
        cursor: pointer;
      }
      .primary {
        background: var(--acid) !important;
      }
      .blue {
        background: var(--blue) !important;
      }
      .pink {
        background: var(--pink) !important;
      }
      .hint,
      .pick-title {
        font: 900 9px Helvetica;
        text-transform: uppercase;
        margin-top: 7px;
      }
      .nav {
        display: flex;
        gap: 6px;
        margin: 10px 0;
        flex-wrap: wrap;
      }
      .nav a {
        color: #050505;
        font: 900 10px Helvetica;
        text-decoration: none;
        border: 2px solid #050505;
        padding: 6px;
        background: #fff;
      }
      .nav a.active {
        background: var(--pink);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 7px 0;
        font: 900 10px Helvetica;
        text-transform: uppercase;
      }
      .check input {
        width: 18px;
        height: 18px;
        accent-color: var(--pink);
      }
      #popupFields {
        display: none;
      }
      .preset {
        padding: 8px;
        background: #fff;
        border: 2px solid #050505;
        font: 900 11px Helvetica;
        margin-top: 7px;
      }
      .top-controls {
        margin: 10px 0 4px;
      }
      .top-controls .action {
        font-size: 13px;
        padding: 12px 8px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div class="art"><canvas id="c" width="1080" height="1350"></canvas></div>
    </div>
    <aside id="panel">
      <h1>POST 02<br />COMPOSER</h1>
      <div class="sub">STROBE / 4:5</div>
      <div class="nav">
        <a href="index.html">POST 01 · MAPPA</a
        ><a class="active" href="intro.html">POST 02 · ICON</a
        ><a href="event.html">POST 03 · EVENT</a
        ><a href="identity.html">ID VISIVA</a>
      </div>
      <div class="actions top-controls">
        <button class="action pink" id="preview">▶ PLAY SEQUENZA</button>
      </div>
      <div class="section">
        <div class="title">TESTI</div>
        <div class="field">
          <label>Titolo</label
          ><input id="headline" value="EX CASA DEL CUSTODE" />
        </div>
        <div class="row">
          <div class="field">
            <label>Anno</label><input id="year" value="2026 / 2027" />
          </div>
          <div class="field">
            <label>Info</label
            ><input id="info" value="GIARDINO DELLA MONTAGNOLA" />
          </div>
        </div>
        <div class="field">
          <label>Scritta centrale</label
          ><input id="caption" value="New programme!" />
        </div>
        <div class="field">
          <label>Footer</label><input id="footer" value="@excasadelcustode" />
        </div>
      </div>
      <div class="section">
        <div class="title">DURATA / POPUP</div>
        <label class="check"
          ><input id="popupOn" type="checkbox" /> USA 3 POPUP</label
        >
        <div class="preset" id="presetInfo">PRESET: 5 SEC · SENZA POPUP</div>
        <div id="popupFields">
          <div class="field">
            <label>Popup 01</label
            ><textarea id="p1">UNO SPAZIO CHE RESISTE.</textarea>
          </div>
          <div class="field">
            <label>Popup 02</label
            ><textarea id="p2">DATI, CORPI, LUOGHI.</textarea>
          </div>
          <div class="field">
            <label>Popup 03</label
            ><textarea id="p3">EX CASA DEL CUSTODE.</textarea>
          </div>
        </div>
      </div>
      <div class="section">
        <div class="title">STRISCE</div>
        <label class="check"
          ><input id="tickerOn" type="checkbox" checked /> VISUALIZZA</label
        >
        <div class="field">
          <label>Sopra →</label
          ><input id="tickerTop" value="EX CASA DEL CUSTODE" />
        </div>
        <div class="field">
          <label>Sotto ←</label
          ><input
            id="tickerBottom"
            value="ASAP — CUSTODIA — BOLOGNA — ALTRI NOMI"
          />
        </div>
        <div class="field">
          <label>Velocità</label
          ><input id="tickerSpeed" type="range" min="20" max="220" value="85" />
        </div>
      </div>
      <div class="section">
        <div class="title">STROBO</div>
        <div class="pick-title">ICONA A</div>
        <div class="emoji" id="emojiA"></div>
        <div class="pick-title">ICONA B</div>
        <div class="emoji" id="emojiB"></div>
        <div class="field">
          <label>Scala</label
          ><input
            id="scale"
            type="range"
            min=".35"
            max="1.5"
            step=".05"
            value="1"
          />
        </div>
        <div class="field">
          <label>Velocità strobo</label
          ><input
            id="speed"
            type="range"
            min="55"
            max="500"
            step="5"
            value="120"
          />
        </div>
      </div>
      <div class="section">
        <div class="title">SFONDO</div>
        <div class="palette" id="palette"></div>
      </div>
      <div class="section">
        <div class="title">LOGHI</div>
        <div class="field">
          <label>Logo 1</label
          ><input class="logo" data-i="0" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label>Logo 2</label
          ><input class="logo" data-i="1" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label>Logo 3</label
          ><input class="logo" data-i="2" type="file" accept="image/*" />
        </div>
        <div class="field">
          <label>ARCI</label><input id="arci" type="file" accept="image/*" />
        </div>
      </div>
      <div class="section">
        <div class="title">EXPORT INSTAGRAM</div>
        <button class="action blue" id="folder" style="width:100%;margin-bottom:7px">CARTELLA</button>
        <div class="actions"><button class="action primary" id="save">PNG POST · 4:5</button><button class="action blue" id="saveStory">PNG STORY · 9:16</button></div>
        <button class="action pink" id="rec" style="width:100%;margin-top:7px">MP4 POST · ANIMAZIONE</button>
        <div class="hint" id="status">OUTPUT: DOWNLOADS</div>
      </div>
    </aside>
    <script src="vendor/mp4-muxer.js?v=1"></script>
    <script src="ig-export.js?v=5"></script>
    <script>
      const W = 1080,
        H = 1350,
        c = document.getElementById("c"),
        x = c.getContext("2d"),
        BG = [
          "#08090B",
          "#151619",
          "#242529",
          "#3A3B3F",
          "#5A5B5E",
          "#858588",
          "#C5C3C4",
        ],
        EM = [
          "🐀",
          "🕳️",
          "🌳",
          "⛲️",
          "🏡",
          "🛝",
          "🎪",
          "🎡",
          "🌟",
          "💦",
          "💗",
          "🚨",
          "🧜‍♀️",
          "🪩",
          "🎧",
          "🎛️",
          "🎚️",
          "🔊",
          "🎶",
          "⚡",
          "✨",
          "💥",
          "📡",
          "💡",
          "♥",
        ],
        $ = (id) => document.getElementById(id);
      const s = {
        bg: BG[1],
        a: "🐀",
        b: "🌟",
        logos: [null, null, null],
        arci: null,
        dir: null,
        playing: false,
        started: 0,
        strobeOffset: Math.floor(Math.random() * BG.length),
        showLogos: false,
      };
      function dots() {
        x.save();
        x.fillStyle = "rgba(5,5,5,.24)";
        const cx = 540,
          cy = 660,
          st = 24;
        function dot(a, b, r = 2.4) {
          x.beginPath();
          x.arc(a, b, r, 0, Math.PI * 2);
          x.fill();
        }
        [168, 264, 360].forEach((r) => {
          for (let q = cx - r; q <= cx + r; q += st) {
            dot(q, cy - r);
            dot(q, cy + r);
          }
          for (let q = cy - r + st; q < cy + r; q += st) {
            dot(cx - r, q);
            dot(cx + r, q);
          }
        });
        for (let d = -360; d <= 360; d += st) {
          dot(cx + d, cy, 2);
          dot(cx, cy + d, 2);
        }
        for (let d = -264; d <= 264; d += st) {
          dot(cx + d, cy + d, 1.8);
          dot(cx + d, cy - d, 1.8);
        }
        x.restore();
      }
      function identity() {
        x.textAlign = "left";
        x.textBaseline = "top";
        x.font = "bold 42px Helvetica";
        x.fillStyle = "#ff61b6";
        x.fillText($("headline").value, 61, 72);
        x.strokeStyle = "#050505";
        x.lineWidth = 5;
        x.fillStyle = "#fff";
        x.strokeText($("headline").value, 55, 66);
        x.fillText($("headline").value, 55, 66);
        x.fillStyle = "#050505";
        x.font = "bold 28px Helvetica";
        x.fillText($("year").value, 57, 117);
        x.font = "bold 12px Helvetica";
        x.fillText($("info").value, 58, 155);
        x.textBaseline = "bottom";
        x.fillText($("footer").value, 55, H - 72);
      }
      function popup(txt, px, py, a = 1) {
        const w = 300,
          maxTextWidth = w - 30;
        x.font = "14px Helvetica";
        const lines = [];
        String(txt || "").split("\n").forEach((paragraph) => {
          const words = paragraph.trim().split(/\s+/).filter(Boolean);
          if (!words.length) { lines.push(""); return; }
          let line = "";
          words.forEach((word) => {
            const test = line ? line + " " + word : word;
            if (line && x.measureText(test).width > maxTextWidth) { lines.push(line); line = word; }
            else line = test;
          });
          if (line) lines.push(line);
        });
        const h = Math.min(300, Math.max(180, 100 + Math.max(1, lines.length) * 20)),
          S = 1.55 * a;
        x.save();
        x.translate(px + w / 2, py + h / 2);
        x.scale(S, S);
        x.translate(-w / 2, -h / 2);
        x.fillStyle = "#F5F5F7";
        x.strokeStyle = "rgba(0,0,0,.18)";
        x.lineWidth = 1;
        x.beginPath();
        x.roundRect(0, 0, w, h, 15);
        x.fill();
        x.stroke();
        x.fillStyle = "#ECECEF";
        x.beginPath();
        x.roundRect(0, 0, w, 32, [15, 15, 0, 0]);
        x.fill();
        x.fillStyle = "rgba(0,0,0,.4)";
        [17, 31, 45].forEach((q) => {
          x.beginPath();
          x.arc(q, 16, 4.5, 0, Math.PI * 2);
          x.fill();
        });
        x.fillStyle = "#050505";
        x.font = "14px Helvetica";
        x.textAlign = "left";
        x.textBaseline = "top";
        const maxLines = Math.floor((h - 85) / 20);
        lines.slice(0, maxLines).forEach((line, i) => x.fillText(i === maxLines - 1 && lines.length > maxLines ? line + "…" : line, 15, 70 + i * 20));
        x.restore();
      }
      function ticker(txt, y, dir, now) {
        x.save();
        x.fillStyle = "#050505";
        x.fillRect(0, y, W, 58);
        x.font = "900 27px Helvetica";
        x.fillStyle = "#fff";
        x.textBaseline = "middle";
        const unit = (txt || "—") + "   ✦   ",
          tw = Math.max(120, x.measureText(unit).width),
          off = ((((now / 1000) * +$("tickerSpeed").value) % tw) + tw) % tw;
        for (let q = -tw * 2; q < W + tw * 2; q += tw)
          x.fillText(unit, q + (dir > 0 ? off : -off), y + 29);
        x.restore();
      }
      function imgFit(i, cx, cy, m) {
        let r = Math.min(m / i.width, m / i.height);
        x.drawImage(
          i,
          cx - (i.width * r) / 2,
          cy - (i.height * r) / 2,
          i.width * r,
          i.height * r,
        );
      }
      function durationMs() {
        return $("popupOn").checked ? 10000 : 5000;
      }
      function render() {
        const now = performance.now(),
          elapsed = s.playing ? now - s.started : 0,
          dur = durationMs(),
          withPop = $("popupOn").checked,
          finalAt = withPop ? 6200 : 1200,
          strobo = s.playing && elapsed >= finalAt,
          ph = strobo ? Math.floor((elapsed - finalAt) / 95) : 0;
        x.fillStyle = strobo ? BG[(ph + s.strobeOffset) % BG.length] : s.bg;
        x.fillRect(0, 0, W, H);
        dots();
        identity();
        x.textAlign = "center";
        x.textBaseline = "middle";
        x.font = `${430 * +$("scale").value}px Arial`;
        x.fillStyle = "#050505";
        x.fillText(strobo && ph % 2 ? s.b : s.a, W / 2, 620);
        if (typeof drawAnimatedCaption === "function") drawAnimatedCaption(now);
        else {
          x.font = "italic 44px Times New Roman";
          x.fillStyle = "#050505";
          x.fillText($("caption").value, W / 2, 900);
        }
        if (withPop && s.playing) {
          const vals = [$("p1").value, $("p2").value, $("p3").value],
            pos = [
              [610, 220],
              [110, 500],
              [590, 800],
            ];
          for (let i = 0; i < 3; i++) {
            const at = 1000 + i * 1500;
            if (elapsed >= at)
              popup(
                vals[i],
                pos[i][0],
                pos[i][1],
                Math.min(1, (elapsed - at) / 250),
              );
          }
        }
        if (s.showLogos) {
          const xs = [795, 885, 975];
          for (let i = 0; i < 3; i++) {
            if (s.logos[i]) imgFit(s.logos[i], xs[i], 1250, 55);
            else {
              x.font = "38px Arial";
              x.fillStyle = "#050505";
              x.fillText("🌟", xs[i], 1250);
            }
          }
        }
        if (s.arci) imgFit(s.arci, 982, 105, 90);
        else {
          x.font = "76px Arial";
          x.fillStyle = "#050505";
          x.fillText("★", 982, 105);
        }
        if ($("tickerOn").checked) {
          ticker($("tickerTop").value, 0, 1, now);
          ticker($("tickerBottom").value, H - 58, -1, now);
        }
        if (s.playing && elapsed >= dur) {
          s.playing = false;
          $("preview").textContent = "▶ PLAY SEQUENZA";
          $("status").textContent = "✓ FINE " + dur / 1000 + " SEC";
        }
        requestAnimationFrame(render);
      }
      function syncPreset() {
        $("popupFields").style.display = $("popupOn").checked
          ? "block"
          : "none";
        $("presetInfo").textContent = $("popupOn").checked
          ? "PRESET: 10 SEC · CON 3 POPUP"
          : "PRESET: 5 SEC · SENZA POPUP";
      }
      $("popupOn").onchange = syncPreset;
      syncPreset();
      function picker(id, k) {
        EM.forEach((v) => {
          const b = document.createElement("button");
          b.className = "em";
          b.textContent = v;
          b.onclick = () => {
            s[k] = v;
            [...$(id).children].forEach((z) =>
              z.classList.toggle("active", z.textContent === v),
            );
          };
          $(id).appendChild(b);
        });
        [...$(id).children].forEach((z) =>
          z.classList.toggle("active", z.textContent === s[k]),
        );
      }
      picker("emojiA", "a");
      picker("emojiB", "b");
      BG.forEach((v) => {
        const b = document.createElement("button");
        b.className = "swatch";
        b.style.background = v;
        b.onclick = () => (s.bg = v);
        $("palette").appendChild(b);
      });
      function load(inp, cb) {
        const f = inp.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (e) => {
          const im = new Image();
          im.onload = () => cb(im);
          im.src = e.target.result;
        };
        r.readAsDataURL(f);
      }
      document
        .querySelectorAll(".logo")
        .forEach(
          (i) =>
            (i.onchange = () => load(i, (m) => (s.logos[+i.dataset.i] = m))),
        );
      $("arci").onchange = () => load($("arci"), (m) => (s.arci = m));
      $("preview").onclick = () => {
        s.playing = !s.playing;
        s.started = performance.now();
        s.strobeOffset = Math.floor(Math.random() * BG.length);
        $("preview").textContent = s.playing ? "■ STOP" : "▶ PLAY SEQUENZA";
      };
      $("folder").onclick = async () => {
        if (!window.showDirectoryPicker) return;
        try {
          s.dir = await showDirectoryPicker({ mode: "readwrite" });
          $("status").textContent = "OUTPUT: " + s.dir.name;
        } catch (e) {}
      };
      async function saveBlob(b, n) {
        if (s.dir) {
          const f = await s.dir.getFileHandle(n, { create: true }),
            w = await f.createWritable();
          await w.write(b);
          await w.close();
          return;
        }
        const a = document.createElement("a"), u = URL.createObjectURL(b);
        a.href = u;
        a.download = n;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 1800);
      }
      function savePNG(story) {
        const out = document.createElement("canvas");
        out.width = 2160; out.height = story ? 3840 : 2700;
        const ox = out.getContext("2d");
        ox.fillStyle = s.bg; ox.fillRect(0, 0, out.width, out.height);
        ox.drawImage(c, 0, story ? 570 : 0, 2160, 2700);
        out.toBlob(async (b) => {
          await saveBlob(b, `ex-casa-post02-${story ? "story-9x16" : "post-4x5"}-${Date.now()}.png`);
          $("status").textContent = `✓ PNG ${story ? "STORY 2160×3840" : "POST 2160×2700"} · ${(b.size / 1024 / 1024).toFixed(1)} MB`;
        }, "image/png");
      }
      $("save").onclick = () => savePNG(false);
      $("saveStory").onclick = () => savePNG(true);
      $("rec").onclick = async () => {
        if (s.exporting) return;
        try {
          s.playing = true; s.started = performance.now(); s.strobeOffset = Math.floor(Math.random() * BG.length);
          $("preview").textContent = "■ STOP"; $("status").textContent = "● MP4 H.264 · 2160×2700";
          s.exporting = IGExport.startMP4({ canvas: c, scale: 2, duration: durationMs(), onProgress: (p) => $("status").textContent = `● MP4 H.264 · ${Math.round(p * 100)}%` });
          const b = await s.exporting.promise;
          await saveBlob(b, `ex-casa-post02-animation-${Date.now()}.mp4`);
          $("status").textContent = `✓ MP4 POST 2160×2700 · ${(b.size / 1024 / 1024).toFixed(1)} MB`;
        } catch (e) {
          if (e.name !== "AbortError") { console.error(e); $("status").textContent = `MP4 ERROR · ${e.message || e}`; }
        } finally {
          s.exporting = null; s.playing = false; $("preview").textContent = "▶ PLAY SEQUENZA";
        }
      };
      render();
    </script>
    <script src="intro-visibility-overrides.js"></script>
    <script src="caption-animation.js?v=2"></script>
  </body>
</html>
