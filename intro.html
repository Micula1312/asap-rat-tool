<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EX CASA — INTRO POST COMPOSER</title><style>:root{--ink:#050505;--pink:#ff61b6;--acid:#dfff00;--blue:#53b7ff;--panel:#f3f3f0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d8d8;font-family:Helvetica,Arial,sans-serif;color:#050505}#stage{position:fixed;inset:0 360px 0 0;display:flex;align-items:center;justify-content:center;padding:18px}.art{width:min(calc((100vh - 36px)*.8),calc(100vw - 396px));aspect-ratio:4/5;box-shadow:0 0 0 2px #050505}.art canvas{width:100%;height:100%;display:block}#panel{position:fixed;right:0;top:0;width:360px;height:100vh;overflow:auto;padding:12px 12px 34px;background:var(--panel);border-left:4px solid #050505;box-shadow:-10px 0 0 var(--pink),-14px 0 0 #050505}h1{margin:0;font:900 30px/.86 Helvetica;letter-spacing:-2px;color:#fff;-webkit-text-stroke:2px #050505;text-shadow:3px 3px 0 var(--pink),5px 5px 0 #050505}.sub,.title{display:inline-block;padding:4px 7px;background:var(--acid);border:2px solid #050505;box-shadow:3px 3px 0 #050505;font:900 10px Helvetica;text-transform:uppercase}.section{border-top:3px solid #050505;padding-top:10px;margin-top:15px}.title{background:#050505;color:#fff;box-shadow:3px 3px 0 var(--pink);margin-bottom:8px}.field{margin-bottom:8px}.field label{display:inline-block;margin-bottom:3px;padding:2px 4px;background:#fff;border:1px solid #050505;font:900 9px Helvetica;text-transform:uppercase}.field input{width:100%;border:2px solid #050505;padding:7px 8px;background:#fff;font:800 13px Helvetica}.row,.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette,.emoji{display:flex;flex-wrap:wrap;gap:5px}.swatch,.em{width:32px;height:32px;border:2px solid #050505;background:#fff;cursor:pointer;font-size:18px}.swatch{font-size:0}.em.active{background:var(--acid)}button.action{border:2px solid #050505;background:#fff;padding:10px 8px;font:900 11px Helvetica;box-shadow:4px 4px 0 #050505;cursor:pointer}.primary{background:var(--acid)!important}.blue{background:var(--blue)!important}.pink{background:var(--pink)!important}.hint,.pick-title{font:900 9px Helvetica;text-transform:uppercase;margin-top:7px}.nav{display:flex;gap:6px;margin:10px 0}.nav a{color:#050505;font:900 10px Helvetica;text-decoration:none;border:2px solid #050505;padding:6px;background:#fff}.nav a.active{background:var(--pink)}.check{display:flex;align-items:center;gap:7px;margin:7px 0;font:900 10px Helvetica;text-transform:uppercase}.check input{width:18px;height:18px;accent-color:var(--pink)}.range-value{font-size:10px;font-weight:900}</style></head><body><div id="stage"><div class="art"><canvas id="c" width="1080" height="1350"></canvas></div></div><aside id="panel"><h1>INTRO POST<br>COMPOSER</h1><div class="sub">STATIC + STROBE / 4:5</div><div class="nav"><a href="index.html">ANIMAZIONE</a><a class="active" href="intro.html">POST INTRO</a></div><div class="section"><div class="title">TESTI</div><div class="field"><label>Titolo</label><input id="headline" value="EX CASA DEL CUSTODE"></div><div class="row"><div class="field"><label>Anno</label><input id="year" value="2026 / 2027"></div><div class="field"><label>Info</label><input id="info" value="GIARDINO DELLA MONTAGNOLA"></div></div><div class="field"><label>Stringa finale</label><input id="caption" value="2026 edition"></div><div class="field"><label>Footer</label><input id="footer" value="@excasadelcustode"></div></div><div class="section"><div class="title">STRISCE SCORREVOLI</div><label class="check"><input id="tickerOn" type="checkbox"> VISUALIZZA STRISCE</label><div class="field"><label>Testo sopra →</label><input id="tickerTop" value="EX CASA DEL CUSTODE"></div><div class="field"><label>Testo sotto ←</label><input id="tickerBottom" value="ASAP — CUSTODIA — BOLOGNA — "></div><div class="field"><label>Velocità</label><input id="tickerSpeed" type="range" min="20" max="220" step="5" value="85"></div></div><div class="section"><div class="title">STROBO TRA 2 ICONE</div><div class="pick-title">ICONA A</div><div class="emoji" id="emojiA"></div><div class="pick-title">ICONA B</div><div class="emoji" id="emojiB"></div><div class="field"><label>Scala icona</label><input id="scale" type="range" min=".35" max="1.5" step=".05" value="1"></div><div class="field"><label>Posizione verticale</label><input id="posY" type="range" min="300" max="1000" step="10" value="650"></div><div class="field"><label>Velocità strobo</label><input id="speed" type="range" min="55" max="500" step="5" value="120"></div><label class="check"><input id="light" type="checkbox" checked> STROBO LUMINOSO</label><div class="field"><label>Intensità luce</label><input id="lightPower" type="range" min="0" max="100" step="5" value="75"></div><div class="field"><label>Durata REC</label><input id="duration" type="range" min="2" max="15" value="6"></div><div class="actions"><button class="action pink" id="preview">PLAY STROBO</button><button class="action primary" id="rec">REC WEBM</button></div></div><div class="section"><div class="title">SFONDO</div><div class="palette" id="palette"></div></div><div class="section"><div class="title">LOGHI</div><div class="field"><label>Logo 1 PNG</label><input class="logo" data-i="0" type="file" accept="image/*"></div><div class="field"><label>Logo 2 PNG</label><input class="logo" data-i="1" type="file" accept="image/*"></div><div class="field"><label>Logo 3 PNG</label><input class="logo" data-i="2" type="file" accept="image/*"></div><div class="field"><label>Logo ARCI</label><input id="arci" type="file" accept="image/*"></div></div><div class="section"><div class="title">EXPORT</div><div class="actions"><button class="action blue" id="folder">SCEGLI CARTELLA</button><button class="action primary" id="save">SALVA PNG</button></div><div class="hint" id="status">OUTPUT: DOWNLOADS</div></div></aside><script>
const W=1080,H=1350,c=document.getElementById('c'),x=c.getContext('2d'),BG=['#8D8D8A','#F1E9FF','#91C792','#FFF1CE','#CFE8FF','#FFD7EA','#0B0B0F'],EM=['🐀','🕳️','🌳','⛲️','🏡','🛝','🎪','🎡','🌟','💦','♥'],s={bg:BG[1],a:'🐀',b:'🌟',logos:[null,null,null],arci:null,dir:null,playing:false,started:0};
function grid(a=.1){x.save();x.strokeStyle=`rgba(5,5,5,${a})`;for(let q=0;q<=W;q+=24){x.beginPath();x.moveTo(q,0);x.lineTo(q,H);x.stroke()}for(let q=0;q<=H;q+=24){x.beginPath();x.moveTo(0,q);x.lineTo(W,q);x.stroke()}x.restore()}function imgFit(i,cx,cy,m){let r=Math.min(m/i.width,m/i.height);x.drawImage(i,cx-i.width*r/2,cy-i.height*r/2,i.width*r,i.height*r)}function identity(){x.textAlign='left';x.textBaseline='top';x.font='bold 42px Helvetica';x.fillStyle='#ff61b6';x.fillText(headline.value,61,35);x.strokeStyle='#050505';x.lineWidth=5;x.fillStyle='#fff';x.strokeText(headline.value,55,29);x.fillText(headline.value,55,29);x.fillStyle='#050505';x.font='bold 28px Helvetica';x.fillText(year.value,57,80);x.font='bold 12px Helvetica';x.fillText(info.value,58,118);x.textBaseline='bottom';x.fillText(footer.value,55,H-26)}
function ticker(text,y,dir,now){x.save();x.fillStyle='#050505';x.fillRect(0,y,W,54);x.font='900 25px Helvetica';x.fillStyle='#fff';x.textBaseline='middle';x.textAlign='left';const unit=(text+'   ✦   '),tw=x.measureText(unit).width,off=((now/1000)*(+tickerSpeed.value)*dir)%tw;for(let q=-tw*2;q<W+tw*2;q+=tw)x.fillText(unit,q+off,y+27);x.restore()}
function draw(){let now=performance.now(),sp=+speed.value,ph=s.playing?Math.floor((now-s.started)/sp):0,flash=s.playing&&light.checked&&ph%2,p=+lightPower.value/100;x.fillStyle=s.bg;x.fillRect(0,0,W,H);grid(flash?.035:.1);if(flash){x.save();x.globalAlpha=.18+.72*p;x.fillStyle='#fff';x.fillRect(0,0,W,H);let g=x.createRadialGradient(W/2,+posY.value,20,W/2,+posY.value,520);g.addColorStop(0,`rgba(255,255,255,${.95*p})`);g.addColorStop(.35,`rgba(255,97,182,${.42*p})`);g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H);x.restore()}identity();let icon=s.playing&&ph%2?s.b:s.a,py=+posY.value,sc=+scale.value;x.textAlign='center';x.textBaseline='middle';x.font=`${430*sc}px Arial`;x.fillStyle='#050505';if(flash){x.save();x.shadowColor='#fff';x.shadowBlur=55+95*p;x.fillText(icon,W/2,py);x.restore()}else x.fillText(icon,W/2,py);x.font='italic 38px Times New Roman';x.fillText(caption.value,W/2,py+260*sc);let xs=[795,885,975],ly=1297;for(let i=0;i<3;i++){x.beginPath();x.fillStyle='#fff';x.strokeStyle='#050505';x.lineWidth=2;x.arc(xs[i],ly,33,0,Math.PI*2);x.fill();x.stroke();if(s.logos[i])imgFit(s.logos[i],xs[i],ly,45);else{x.font='38px Arial';x.fillStyle='#050505';x.fillText('🌟',xs[i],ly)}}if(s.arci)imgFit(s.arci,982,76,90);else{x.font='76px Arial';x.fillText('★',982,76)}if(tickerOn.checked){ticker(tickerTop.value||'EX CASA DEL CUSTODE',170,1,now);ticker(tickerBottom.value||'ASAP',1135,-1,now)}requestAnimationFrame(draw)}
function load(i,cb){let f=i.files[0];if(!f)return,r=new FileReader;r.onload=e=>{let im=new Image;im.onload=()=>cb(im);im.src=e.target.result};r.readAsDataURL(f)}function picker(id,k){let e=document.getElementById(id);EM.forEach(v=>{let b=document.createElement('button');b.className='em';b.textContent=v;b.onclick=()=>{s[k]=v;[...e.children].forEach(z=>z.classList.toggle('active',z.textContent===v))};e.appendChild(b)})}picker('emojiA','a');picker('emojiB','b');BG.forEach(v=>{let b=document.createElement('button');b.className='swatch';b.style.background=v;b.onclick=()=>s.bg=v;palette.appendChild(b)});document.querySelectorAll('.logo').forEach(i=>i.onchange=()=>load(i,m=>s.logos[+i.dataset.i]=m));arci.onchange=()=>load(arci,m=>s.arci=m);preview.onclick=()=>{s.playing=!s.playing;s.started=performance.now();preview.textContent=s.playing?'STOP STROBO':'PLAY STROBO'};folder.onclick=async()=>{try{s.dir=await showDirectoryPicker({mode:'readwrite'});status.textContent='OUTPUT: '+s.dir.name}catch(e){}};async function saveBlob(b,n){if(s.dir){try{let f=await s.dir.getFileHandle(n,{create:true}),w=await f.createWritable();await w.write(b);await w.close();return}catch(e){}}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}save.onclick=()=>c.toBlob(b=>saveBlob(b,'ex-casa-intro-'+Date.now()+'.png'));rec.onclick=()=>{try{let mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm',r=new MediaRecorder(c.captureStream(60),{mimeType:mime}),ch=[];r.ondataavailable=e=>e.data.size&&ch.push(e.data);r.onstop=()=>saveBlob(new Blob(ch,{type:mime}),'ex-casa-intro-strobe-'+Date.now()+'.webm');s.playing=true;s.started=performance.now();r.start(250);status.textContent='● REC';setTimeout(()=>{r.requestData();r.stop();s.playing=false},+duration.value*1000)}catch(e){status.textContent='REC ERROR'}};draw();
</script></body></html>
