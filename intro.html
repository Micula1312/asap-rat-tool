<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EX CASA — INTRO POST COMPOSER</title>
<style>
:root{--ink:#050505;--pink:#ff61b6;--acid:#dfff00;--blue:#53b7ff;--panel:#f3f3f0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d8d8;font-family:Helvetica,Arial,sans-serif;color:var(--ink)}
#stage{position:fixed;left:0;top:0;right:360px;bottom:0;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px}.art{position:relative;width:min(calc((100vh - 36px)*.8),calc(100vw - 396px));aspect-ratio:4/5;background:#f1e9ff;overflow:hidden;box-shadow:0 0 0 2px #050505}.art canvas{width:100%;height:100%;display:block}
#panel{position:fixed;right:0;top:0;width:360px;height:100vh;overflow:auto;padding:12px 12px 34px;background:var(--panel);border-left:4px solid var(--ink);box-shadow:-10px 0 0 var(--pink),-14px 0 0 var(--ink)}
h1{margin:0 0 5px;font:900 30px/.86 Helvetica,Arial,sans-serif;letter-spacing:-2px;text-transform:uppercase;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--ink)}.sub,.title{display:inline-block;padding:4px 7px;background:var(--acid);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font:900 10px/1 Helvetica,Arial,sans-serif;text-transform:uppercase}.section{border-top:3px solid var(--ink);padding-top:10px;margin-top:15px}.title{background:#050505;color:#fff;box-shadow:3px 3px 0 var(--pink);margin-bottom:8px}.field{margin-bottom:8px}.field label{display:inline-block;margin-bottom:3px;padding:2px 4px;background:#fff;border:1px solid #050505;font:900 9px/1 Helvetica,Arial,sans-serif;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:2px solid #050505;padding:7px 8px;background:#fff;font:800 13px/1.05 Helvetica,Arial,sans-serif;outline:none}.field textarea{min-height:60px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.palette,.emoji{display:flex;flex-wrap:wrap;gap:5px}.swatch,.em{width:32px;height:32px;border:2px solid #050505;background:#fff;cursor:pointer;font-size:18px}.swatch{font-size:0}.em.active{background:var(--acid)}button.action{border:2px solid #050505;background:#fff;padding:10px 8px;font:900 11px/1 Helvetica,Arial,sans-serif;text-transform:uppercase;box-shadow:4px 4px 0 #050505;cursor:pointer}.action.primary{background:var(--acid)}.action.blue{background:var(--blue)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.hint{margin-top:7px;font:800 9px/1.2 Helvetica,Arial,sans-serif;text-transform:uppercase}.nav{display:flex;gap:6px;margin:10px 0}.nav a{color:#050505;font:900 10px/1 Helvetica,Arial,sans-serif;text-decoration:none;border:2px solid #050505;padding:6px;background:#fff}.nav a.active{background:var(--pink)}
@media(max-width:900px){#panel{width:320px}#stage{right:320px}.art{width:min(calc((100vh - 36px)*.8),calc(100vw - 356px))}}
</style>
</head><body>
<div id="stage"><div class="art"><canvas id="c" width="1080" height="1350"></canvas></div></div>
<aside id="panel"><h1>INTRO POST<br>COMPOSER</h1><div class="sub">STATIC / 4:5 / ASAP RAT TOOL</div><div class="nav"><a href="index.html">ANIMAZIONE</a><a class="active" href="intro.html">POST INTRO</a></div>
<div class="section"><div class="title">TESTI</div><div class="field"><label>Titolo</label><textarea id="headline">EX CASA DEL CUSTODE</textarea></div><div class="row"><div class="field"><label>Anno / kicker</label><input id="year" value="2026 / 2027"></div><div class="field"><label>Info</label><input id="info" value="GIARDINO DELLA MONTAGNOLA"></div></div><div class="field"><label>Stringa finale</label><input id="caption" value="2026 edition"></div><div class="field"><label>Footer</label><input id="footer" value="@excasadelcustode"></div></div>
<div class="section"><div class="title">ELEMENTO FINALE</div><div class="emoji" id="emoji"></div><div class="field"><label>Scala</label><input id="scale" type="range" min=".35" max="1.5" step=".05" value="1"></div><div class="field"><label>Posizione verticale</label><input id="posY" type="range" min="250" max="1050" step="10" value="650"></div></div>
<div class="section"><div class="title">SFONDO</div><div class="palette" id="palette"></div></div>
<div class="section"><div class="title">LOGHI</div><div class="field"><label>Logo 1 PNG</label><input class="logo" data-i="0" type="file" accept="image/*"></div><div class="field"><label>Logo 2 PNG</label><input class="logo" data-i="1" type="file" accept="image/*"></div><div class="field"><label>Logo 3 PNG</label><input class="logo" data-i="2" type="file" accept="image/*"></div><div class="field"><label>Stella / logo ARCI alto destra</label><input id="arci" type="file" accept="image/*"></div></div>
<div class="section"><div class="title">EXPORT</div><div class="actions"><button class="action blue" id="folder">SCEGLI CARTELLA</button><button class="action primary" id="save">SALVA PNG</button></div><div class="hint" id="status">OUTPUT: DOWNLOADS</div></div>
</aside>
<script>
const W=1080,H=1350,c=document.getElementById('c'),x=c.getContext('2d');
const BG=['#8D8D8A','#F1E9FF','#91C792','#FFF1CE','#CFE8FF','#FFD7EA','#0B0B0F'];
const EM=['🐀','🕳️','🌳','⛲️','🏡','🛝','🎪','🎡','🌟','💦','♥'];
const s={bg:BG[1],emoji:'🌟',logos:[null,null,null],arci:null,dir:null};
function fitText(text,max,weight='900',family='Helvetica,Arial,sans-serif'){let size=max;x.font=`${weight} ${size}px ${family}`;while(x.measureText(text).width>930&&size>30){size-=2;x.font=`${weight} ${size}px ${family}`}return size}
function grid(){x.save();x.strokeStyle='rgba(5,5,5,.10)';x.lineWidth=1;for(let q=0;q<=W;q+=24){x.beginPath();x.moveTo(q,0);x.lineTo(q,H);x.stroke()}for(let q=0;q<=H;q+=24){x.beginPath();x.moveTo(0,q);x.lineTo(W,q);x.stroke()}x.restore()}
function drawImageFit(img,cx,cy,max){const r=Math.min(max/img.width,max/img.height);x.drawImage(img,cx-img.width*r/2,cy-img.height*r/2,img.width*r,img.height*r)}
function draw(){x.fillStyle=s.bg;x.fillRect(0,0,W,H);grid();x.textBaseline='top';x.fillStyle='#050505';const headline=document.getElementById('headline').value||'';const lines=headline.split('\n');let yy=70;lines.forEach(line=>{const fs=fitText(line,105);x.font=`900 ${fs}px Helvetica,Arial,sans-serif`;x.fillText(line,70,yy);yy+=fs*.88});x.font='700 27px Helvetica,Arial,sans-serif';x.fillText(document.getElementById('year').value,73,yy+20);x.font='800 19px Helvetica,Arial,sans-serif';x.fillText(document.getElementById('info').value,73,yy+61);
const py=+document.getElementById('posY').value,sc=+document.getElementById('scale').value;x.textAlign='center';x.textBaseline='middle';x.font=`${Math.round(430*sc)}px Arial`;x.fillText(s.emoji,W/2,py);x.font='italic 38px Times New Roman';x.fillText(document.getElementById('caption').value,W/2,py+260*sc);x.textAlign='left';x.textBaseline='alphabetic';x.font='800 22px Helvetica,Arial,sans-serif';x.fillText(document.getElementById('footer').value,70,1308);
const xs=[795,885,975],ly=1297;for(let i=0;i<3;i++){x.beginPath();x.fillStyle='#fff';x.strokeStyle='#050505';x.lineWidth=2;x.arc(xs[i],ly,33,0,Math.PI*2);x.fill();x.stroke();if(s.logos[i])drawImageFit(s.logos[i],xs[i],ly,45);else{x.textAlign='center';x.textBaseline='middle';x.font='38px Arial';x.fillText('🌟',xs[i],ly)}}
if(s.arci)drawImageFit(s.arci,982,76,90);else{x.textAlign='center';x.textBaseline='middle';x.fillStyle='#050505';x.font='76px Arial';x.fillText('★',982,76)}requestAnimationFrame(draw)}
function load(input,cb){const f=input.files[0];if(!f)return;const r=new FileReader;r.onload=e=>{const im=new Image;im.onload=()=>cb(im);im.src=e.target.result};r.readAsDataURL(f)}
BG.forEach(v=>{const b=document.createElement('button');b.className='swatch';b.style.background=v;b.onclick=()=>s.bg=v;palette.appendChild(b)});EM.forEach(v=>{const b=document.createElement('button');b.className='em';b.textContent=v;b.onclick=()=>{s.emoji=v;document.querySelectorAll('.em').forEach(z=>z.classList.toggle('active',z.textContent===v))};emoji.appendChild(b)});document.querySelectorAll('.logo').forEach(i=>i.onchange=()=>load(i,img=>s.logos[+i.dataset.i]=img));arci.onchange=()=>load(arci,img=>s.arci=img);
folder.onclick=async()=>{if(!window.showDirectoryPicker)return alert('Usa Chrome/Edge oppure il PNG andrà in Download.');try{s.dir=await showDirectoryPicker({mode:'readwrite'});status.textContent='OUTPUT: '+s.dir.name}catch(e){}};
async function saveBlob(blob,name){if(s.dir){try{const f=await s.dir.getFileHandle(name,{create:true}),w=await f.createWritable();await w.write(blob);await w.close();return}catch(e){}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
save.onclick=()=>c.toBlob(b=>saveBlob(b,'ex-casa-intro-'+Date.now()+'.png'),'image/png');
['headline','year','info','caption','footer','scale','posY'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{}));draw();
</script></body></html>
