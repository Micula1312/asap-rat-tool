<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EX CASA — MERCH</title><style>:root{--ink:#050505;--pink:#ff61b6;--acid:#dfff00;--blue:#53b7ff;--panel:#f3f3f0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d8d8;font-family:Helvetica,Arial,sans-serif;color:var(--ink)}#stage{position:fixed;inset:0 360px 0 0;display:flex;align-items:center;justify-content:center;padding:24px;background:#cfcfca;background-image:linear-gradient(rgba(5,5,5,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(5,5,5,.05) 1px,transparent 1px);background-size:24px 24px}canvas{display:block;max-width:100%;max-height:calc(100vh - 48px);box-shadow:0 0 0 3px var(--ink),10px 10px 0 var(--pink)}#panel{position:fixed;right:0;top:0;width:360px;height:100vh;overflow:auto;padding:12px 12px 34px;background:var(--panel);border-left:4px solid var(--ink);box-shadow:-10px 0 0 var(--pink),-14px 0 0 var(--ink)}h1{margin:0;font:900 30px/.86 Helvetica;letter-spacing:-2px;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--ink)}.nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.nav a{color:var(--ink);font:900 10px Helvetica;text-decoration:none;border:2px solid var(--ink);padding:6px;background:#fff}.nav a.active{background:var(--pink)}.section{border-top:3px solid var(--ink);padding-top:10px;margin-top:15px}.title{display:inline-block;background:var(--ink);color:#fff;padding:4px 7px;margin-bottom:8px;font:900 10px Helvetica;box-shadow:3px 3px 0 var(--pink)}.field{margin-bottom:8px}.field label{display:inline-block;margin-bottom:3px;padding:2px 4px;background:#fff;border:1px solid var(--ink);font:900 9px Helvetica;text-transform:uppercase}.field input,.field select{width:100%;border:2px solid var(--ink);padding:7px 8px;background:#fff;font:800 13px Helvetica}.palette,.emoji{display:flex;flex-wrap:wrap;gap:5px}.sw,.em{width:32px;height:32px;border:2px solid var(--ink);cursor:pointer;background:#fff}.em{font-size:18px}.em.active{background:var(--acid)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}button.action{border:2px solid var(--ink);background:var(--acid);padding:10px 8px;font:900 11px Helvetica;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.blue{background:var(--blue)!important}.hint{font:900 9px/1.4 Helvetica;text-transform:uppercase}@media(max-width:760px){#stage{inset:0 0 45vh 0}#panel{top:55vh;width:100%;height:45vh;border-left:0;border-top:4px solid var(--ink)}}</style></head><body><div id="stage"><canvas id="c" width="900" height="900"></canvas></div><aside id="panel"><h1>MERCH<br>GENERATOR</h1><nav class="nav"><a href="index.html">POST 01</a><a href="intro.html">POST 02</a><a href="identity.html">ID VISIVA</a><a class="active" href="merch.html">MERCH</a></nav><div class="section"><div class="title">OGGETTO</div><div class="field"><label>Supporto</label><select id="item"><option value="tee">T-SHIRT</option><option value="tote">SHOPPER</option><option value="poster">POSTER / PRINT</option></select></div><div class="field"><label>Edition</label><input id="edition" value="037"></div></div><div class="section"><div class="title">TESTI</div><div class="field"><label>Stringa editoriale</label><input id="caption" value="New programme!"></div><div class="field"><label>Info</label><input id="info" value="GIARDINO DELLA MONTAGNOLA · BOLOGNA"></div><div class="field"><label>Ticker / credit</label><input id="credit" value="EX CASA DEL CUSTODE ✦ ASAP ✦ CUSTODIA"></div></div><div class="section"><div class="title">SEGNALETICA</div><div class="emoji" id="emoji"></div></div><div class="section"><div class="title">PALETTE CANONICA</div><div class="palette" id="palette"></div></div><div class="section"><div class="title">EXPORT</div><div class="actions"><button class="action" id="random">RANDOM EDITION</button><button class="action blue" id="save">PNG</button></div><p class="hint">Anteprima contenuta nel supporto: nessun elemento può uscire dalla stampa. Su fondi scuri i testi passano automaticamente al bianco.</p></div></aside><script>
const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id),BG=['#8D8D8A','#F1E9FF','#91C792','#FFF1CE','#CFE8FF','#FFD7EA','#0B0B0F'],EM=['🐀','🕳️','🌳','⛲️','🏡','🛝','🎪','🎡','🌟','💦'];let bg=BG[3],icon='🐀';
function ink(){return bg==='#0B0B0F'?'#fff':'#050505'}
function wordmark(px,py,size=36){x.save();x.font=`900 ${size}px Helvetica,Arial`;x.textAlign='left';x.textBaseline='top';x.lineWidth=Math.max(3,size*.075);x.strokeStyle='#050505';x.fillStyle='#ff61b6';x.strokeText('EX CASA DEL CUSTODE',px+size*.13,py+size*.13);x.fillText('EX CASA DEL CUSTODE',px+size*.13,py+size*.13);x.fillStyle='#fff';x.strokeText('EX CASA DEL CUSTODE',px,py);x.fillText('EX CASA DEL CUSTODE',px,py);x.restore()}
function dots(cx,cy,s=1){x.save();x.fillStyle=bg==='#0B0B0F'?'rgba(255,255,255,.18)':'rgba(5,5,5,.22)';const st=18*s;function d(a,b,r=2.2*s){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}[110,180,250].forEach(r=>{r*=s;for(let q=cx-r;q<=cx+r;q+=st){d(q,cy-r);d(q,cy+r)}for(let q=cy-r+st;q<cy+r;q+=st){d(cx-r,q);d(cx+r,q)}});for(let q=-250*s;q<=250*s;q+=st){d(cx+q,cy,1.8*s);d(cx,cy+q,1.8*s)}x.restore()}
function ticker(px,y,w,h){x.save();x.beginPath();x.rect(px,y,w,h);x.clip();x.fillStyle='#050505';x.fillRect(px,y,w,h);x.fillStyle='#fff';x.font='900 11px Helvetica';x.textAlign='left';x.textBaseline='middle';const t=($('credit').value||'—')+'   ✦   ',tw=Math.max(80,x.measureText(t).width);for(let q=px-tw;q<px+w+tw;q+=tw)x.fillText(t,q,y+h/2);x.restore()}
function art(px,py,w,h,scale){x.save();x.beginPath();x.rect(px,py,w,h);x.clip();x.fillStyle=bg;x.fillRect(px,py,w,h);dots(px+w/2,py+h*.48,scale);wordmark(px+20,py+20,Math.min(24,w*.055));x.textAlign='center';x.textBaseline='middle';x.fillStyle=ink();x.font=`${Math.min(130,w*.28)}px Arial`;x.fillText(icon,px+w/2,py+h*.43);x.font=`italic ${Math.min(34,w*.07)}px Times New Roman`;x.fillText($('caption').value,px+w/2,py+h*.69);x.font=`900 ${Math.min(11,w*.026)}px Helvetica`;x.fillText($('info').value,px+w/2,py+h*.79);x.fillText('EDITION '+$('edition').value,px+w/2,py+h*.84);ticker(px,py+h-28,w,28);x.restore()}
function shirt(){x.save();x.fillStyle='#ece7dc';x.strokeStyle='#bdb7aa';x.lineWidth=2;x.beginPath();x.moveTo(220,180);x.lineTo(330,115);x.lineTo(390,150);x.lineTo(510,150);x.lineTo(570,115);x.lineTo(680,180);x.lineTo(620,320);x.lineTo(565,290);x.lineTo(565,760);x.lineTo(335,760);x.lineTo(335,290);x.lineTo(280,320);x.closePath();x.fill();x.stroke();art(350,325,200,320,.34);x.restore()}
function tote(){x.save();x.fillStyle='#e9e1cf';x.strokeStyle='#bdb7aa';x.lineWidth=3;x.fillRect(240,260,420,440);x.strokeRect(240,260,420,440);x.beginPath();x.moveTo(330,260);x.bezierCurveTo(330,100,570,100,570,260);x.stroke();art(275,330,350,300,.48);x.restore()}
function poster(){x.save();x.fillStyle='#fff';x.fillRect(170,50,560,800);x.strokeStyle='#050505';x.lineWidth=2;x.strokeRect(170,50,560,800);art(190,70,520,760,.72);x.restore()}
function render(){x.clearRect(0,0,900,900);x.fillStyle='#d8d8d4';x.fillRect(0,0,900,900);const it=$('item').value;if(it==='tee')shirt();else if(it==='tote')tote();else poster();requestAnimationFrame(render)}
BG.forEach(v=>{const b=document.createElement('button');b.className='sw';b.style.background=v;b.onclick=()=>bg=v;$('palette').appendChild(b)});EM.forEach(v=>{const b=document.createElement('button');b.className='em';b.textContent=v;b.onclick=()=>{icon=v;[...$('emoji').children].forEach(z=>z.classList.toggle('active',z===b))};$('emoji').appendChild(b)});$('emoji').firstChild.classList.add('active');$('random').onclick=()=>{bg=BG[Math.floor(Math.random()*BG.length)];icon=EM[Math.floor(Math.random()*EM.length)];$('edition').value=String(Math.floor(Math.random()*999)+1).padStart(3,'0')};$('save').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ex-casa-merch-edition-'+$('edition').value+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},'image/png');render();
</script></body></html>
