<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EX CASA — MERCH</title><style>:root{--ink:#050505;--pink:#ff61b6;--acid:#dfff00;--blue:#53b7ff;--panel:#f3f3f0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d8d8;font-family:Helvetica,Arial,sans-serif;color:var(--ink)}#stage{position:fixed;inset:0 360px 0 0;display:flex;align-items:center;justify-content:center;padding:24px;background:#cfcfca;background-image:linear-gradient(rgba(5,5,5,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(5,5,5,.05) 1px,transparent 1px);background-size:24px 24px}canvas{display:block;max-width:100%;max-height:calc(100vh - 48px);box-shadow:0 0 0 3px var(--ink),10px 10px 0 var(--pink)}#panel{position:fixed;right:0;top:0;width:360px;height:100vh;overflow:auto;padding:12px 12px 34px;background:var(--panel);border-left:4px solid var(--ink);box-shadow:-10px 0 0 var(--pink),-14px 0 0 var(--ink)}h1{margin:0;font:900 30px/.86 Helvetica;letter-spacing:-2px;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--ink)}.nav{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.nav a{color:var(--ink);font:900 10px Helvetica;text-decoration:none;border:2px solid var(--ink);padding:6px;background:#fff}.nav a.active{background:var(--pink)}.section{border-top:3px solid var(--ink);padding-top:10px;margin-top:15px}.title{display:inline-block;background:var(--ink);color:#fff;padding:4px 7px;margin-bottom:8px;font:900 10px Helvetica;box-shadow:3px 3px 0 var(--pink)}.field{margin-bottom:8px}.field label{display:inline-block;margin-bottom:3px;padding:2px 4px;background:#fff;border:1px solid var(--ink);font:900 9px Helvetica;text-transform:uppercase}.field input,.field select{width:100%;border:2px solid var(--ink);padding:7px 8px;background:#fff;font:800 13px Helvetica}.palette,.emoji{display:flex;flex-wrap:wrap;gap:5px}.sw,.em{width:32px;height:32px;border:2px solid var(--ink);cursor:pointer;background:#fff}.em{font-size:18px}.em.active{background:var(--acid)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}button.action{border:2px solid var(--ink);background:var(--acid);padding:10px 8px;font:900 11px Helvetica;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.blue{background:var(--blue)!important}.hint{font:900 9px/1.4 Helvetica;text-transform:uppercase}.check{display:flex;gap:7px;align-items:center;font:900 10px Helvetica;margin:7px 0}.check input{width:18px;height:18px;accent-color:var(--pink)}@media(max-width:760px){#stage{inset:0 0 45vh 0}#panel{top:55vh;width:100%;height:45vh;border-left:0;border-top:4px solid var(--ink)}}</style></head><body><div id="stage"><canvas id="c" width="900" height="900"></canvas></div><aside id="panel"><h1>MERCH<br>GENERATOR</h1><nav class="nav"><a href="index.html">POST 01</a><a href="intro.html">POST 02</a><a href="identity.html">ID VISIVA</a><a class="active" href="merch.html">MERCH</a></nav><div class="section"><div class="title">OGGETTO</div><div class="field"><label>Supporto</label><select id="item"><option value="tee">T-SHIRT</option><option value="tote">SHOPPER</option><option value="poster">POSTER / PRINT</option></select></div><div class="field"><label>Edition</label><input id="edition" value="037"></div><label class="check"><input id="back" type="checkbox" checked> MOSTRA GRAFICA GRANDE</label></div><div class="section"><div class="title">TESTI</div><div class="field"><label>Stringa editoriale</label><input id="caption" value="New programme!"></div><div class="field"><label>Info</label><input id="info" value="GIARDINO DELLA MONTAGNOLA · BOLOGNA"></div><div class="field"><label>Ticker / credit</label><input id="credit" value="EX CASA DEL CUSTODE ✦ ASAP ✦ CUSTODIA"></div></div><div class="section"><div class="title">SEGNALETICA</div><div class="emoji" id="emoji"></div></div><div class="section"><div class="title">PALETTE CANONICA</div><div class="palette" id="palette"></div></div><div class="section"><div class="title">EXPORT</div><div class="actions"><button class="action" id="random">RANDOM EDITION</button><button class="action blue" id="save">PNG</button></div><p class="hint">Il wordmark resta quello ufficiale: bianco + contorno nero + offset fucsia. La grafica usa solo palette, retinatura Montagnola, emoji e serif italic dell'identità.</p></div></aside><script>
const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id),BG=['#8D8D8A','#F1E9FF','#91C792','#FFF1CE','#CFE8FF','#FFD7EA','#0B0B0F'],EM=['🐀','🕳️','🌳','⛲️','🏡','🛝','🎪','🎡','🌟','💦'];let bg=BG[3],icon='🐀';
function wordmark(px,py,size=36){x.save();x.font=`900 ${size}px Helvetica,Arial`;x.textAlign='left';x.textBaseline='top';x.lineWidth=Math.max(3,size*.075);x.strokeStyle='#050505';x.fillStyle='#ff61b6';x.strokeText('EX CASA DEL CUSTODE',px+size*.13,py+size*.13);x.fillText('EX CASA DEL CUSTODE',px+size*.13,py+size*.13);x.fillStyle='#fff';x.strokeText('EX CASA DEL CUSTODE',px,py);x.fillText('EX CASA DEL CUSTODE',px,py);x.restore()}
function dots(cx,cy,s=1){x.save();x.fillStyle='rgba(5,5,5,.28)';const st=18*s;function d(a,b,r=2.2*s){x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}[110,180,250].forEach(r=>{r*=s;for(let q=cx-r;q<=cx+r;q+=st){d(q,cy-r);d(q,cy+r)}for(let q=cy-r+st;q<cy+r;q+=st){d(cx-r,q);d(cx+r,q)}});for(let q=-250*s;q<=250*s;q+=st){d(cx+q,cy,1.8*s);d(cx,cy+q,1.8*s)}x.restore()}
function ticker(y,w,h){x.save();x.fillStyle='#050505';x.fillRect(0,y,w,h);x.fillStyle='#fff';x.font='900 13px Helvetica';x.textBaseline='middle';let t=($('credit').value||'—')+'   ✦   ',tw=x.measureText(t).width;for(let q=-tw;q<w+tw;q+=tw)x.fillText(t,q,y+h/2);x.restore()}
function shirt(){x.fillStyle='#ece7dc';x.beginPath();x.moveTo(220,180);x.lineTo(330,115);x.lineTo(390,150);x.lineTo(510,150);x.lineTo(570,115);x.lineTo(680,180);x.lineTo(620,320);x.lineTo(565,290);x.lineTo(565,760);x.lineTo(335,760);x.lineTo(335,290);x.lineTo(280,320);x.closePath();x.fill();x.strokeStyle='#bdb7aa';x.lineWidth=2;x.stroke();x.fillStyle=bg;x.globalAlpha=.92;x.fillRect(355,330,190,300);x.globalAlpha=1;dots(450,470,.35);wordmark(375,350,18);x.textAlign='center';x.font='italic 27px Times New Roman';x.fillStyle='#050505';x.fillText($('caption').value,450,555);x.font='80px Arial';x.fillText(icon,450,480);x.font='900 11px Helvetica';x.fillText($('info').value,450,590);x.fillText('EDITION '+$('edition').value,450,610);ticker(632,190,24)}
function tote(){x.fillStyle='#e9e1cf';x.fillRect(240,260,420,440);x.strokeStyle='#bdb7aa';x.lineWidth=3;x.strokeRect(240,260,420,440);x.beginPath();x.arc(360,280,100,Math.PI,0);x.arc(540,280,100,Math.PI,0);x.stroke();x.fillStyle=bg;x.fillRect(275,330,350,300);dots(450,475,.5);wordmark(300,350,23);x.textAlign='center';x.font='120px Arial';x.fillStyle='#050505';x.fillText(icon,450,500);x.font='italic 34px Times New Roman';x.fillText($('caption').value,450,570);x.font='900 12px Helvetica';x.fillText($('info').value,450,610);x.fillText('EDITION '+$('edition').value,450,630);ticker(646,350,26)}
function poster(){x.fillStyle=bg;x.fillRect(190,70,520,760);dots(450,440,.75);wordmark(225,115,35);x.textAlign='center';x.font='230px Arial';x.fillStyle='#050505';x.fillText(icon,450,450);x.font='italic 54px Times New Roman';x.fillText($('caption').value,450,610);x.font='900 15px Helvetica';x.fillText($('info').value,450,660);x.fillText('EDITION '+$('edition').value,450,685);ticker(730,520,42)}
function render(){x.clearRect(0,0,900,900);x.fillStyle='#d8d8d4';x.fillRect(0,0,900,900);x.save();x.translate(0,0);const it=$('item').value;if(it==='tee')shirt();else if(it==='tote')tote();else poster();x.restore();requestAnimationFrame(render)}
BG.forEach(v=>{let b=document.createElement('button');b.className='sw';b.style.background=v;b.onclick=()=>bg=v;$('palette').appendChild(b)});EM.forEach(v=>{let b=document.createElement('button');b.className='em';b.textContent=v;b.onclick=()=>{icon=v;[...$('emoji').children].forEach(z=>z.classList.toggle('active',z===b))};$('emoji').appendChild(b)});$('emoji').firstChild.classList.add('active');$('random').onclick=()=>{bg=BG[Math.floor(Math.random()*BG.length)];icon=EM[Math.floor(Math.random()*EM.length)];$('edition').value=String(Math.floor(Math.random()*999)+1).padStart(3,'0')};$('save').onclick=()=>c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ex-casa-merch-edition-'+$('edition').value+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)},'image/png');render();
</script></body></html>
