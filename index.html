<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EX CASA DEL CUSTODE — RAT MAP ENGINE</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#ddd}
    body{font-family:Helvetica,Arial,sans-serif}
    canvas{display:block;position:fixed;inset:0;z-index:0}

    #editor-panel{
      position:fixed;top:0;right:0;width:360px;height:100vh;z-index:20;overflow-y:auto;
      padding:12px 12px 30px;background:#efefef;border-left:2px solid #000;color:#000;
      box-shadow:-8px 0 0 rgba(255,120,200,.35)
    }
    #editor-panel h1{
      margin:0 0 2px;font-family:"Times New Roman",Times,serif;font-size:25px;line-height:.95;font-weight:400;
      letter-spacing:-1px;text-transform:none
    }
    #editor-panel .sub{margin:3px 0 14px;font:10px/1 Helvetica,Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}

    .section{border-top:1px dashed #000;padding-top:9px;margin-top:11px}
    .section-title{display:inline-block;margin:0 0 8px;padding:3px 6px;background:#000;color:#fff;font:700 10px/1 Helvetica,Arial,sans-serif;text-transform:uppercase}
    .field{margin-bottom:7px}
    .field label{display:block;margin-bottom:2px;font:10px/1 Helvetica,Arial,sans-serif;text-transform:uppercase}
    .field input,.field textarea{
      width:100%;border:1px solid #000;border-radius:0;padding:7px;background:#fff;color:#000;
      font:14px/1.15 "Times New Roman",Times,serif;outline:none
    }
    .field input:focus,.field textarea:focus{background:#fff7a8}
    .field textarea{min-height:52px;resize:vertical}
    .popup-grid{display:grid;grid-template-columns:92px 1fr;gap:5px}
    .logo-input input{font:10px Helvetica,Arial,sans-serif}
    .hint{margin-top:8px;font:10px/1.25 Helvetica,Arial,sans-serif;background:#ff78c8;padding:6px;border:1px solid #000}

    .control-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
    .control-button{
      border:1px solid #000;border-radius:0;background:#fff;color:#000;padding:10px 5px;cursor:pointer;
      font:700 11px/1 Helvetica,Arial,sans-serif;text-transform:uppercase;box-shadow:3px 3px 0 #000
    }
    .control-button:hover{background:#ff78c8;transform:translate(1px,1px);box-shadow:2px 2px 0 #000}
    .rec-status{margin-top:8px;padding:6px 8px;background:#000;color:#ff78c8;font:700 10px/1 Helvetica,Arial,sans-serif}

    .palette{display:flex;flex-wrap:wrap;gap:4px}
    .swatch{width:31px;height:31px;border:1px solid #000;border-radius:0;cursor:pointer;padding:0}
    .swatch:hover{transform:scale(1.25);z-index:2}
    .coords{font:10px/1 Helvetica,Arial,sans-serif;opacity:.65;margin-top:-3px}

    .scale-row{display:grid;grid-template-columns:86px 1fr 44px;gap:6px;align-items:center;margin:6px 0}
    .scale-row label{font:10px/1 Helvetica,Arial,sans-serif;text-transform:uppercase}
    .scale-row input[type=range]{width:100%;accent-color:#ff78c8}
    .scale-value{font:11px/1 "Times New Roman",Times,serif;text-align:right}

    #editor-panel::-webkit-scrollbar{width:12px}
    #editor-panel::-webkit-scrollbar-track{background:#fff}
    #editor-panel::-webkit-scrollbar-thumb{background:#000;border:3px solid #fff}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>
<body>
  <script src="engine.js"></script>
</body>
</html>
