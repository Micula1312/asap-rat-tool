<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EX CASA DEL CUSTODE — RAT MAP ENGINE</title>
  <style>
    :root{
      --ink:#050505;
      --paper:#f5f0e8;
      --pink:#ff61b6;
      --acid:#dfff00;
      --blue:#53b7ff;
      --red:#ff3b30;
      --panel:#f3f3f0;
      --line:2px;
    }

    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d8d8}
    body{font-family:Helvetica,Arial,sans-serif;color:var(--ink)}
    canvas{display:block;position:fixed;inset:0;z-index:0}

    #editor-panel{
      position:fixed;top:0;right:0;width:360px;height:100vh;z-index:20;overflow-y:auto;
      padding:12px 12px 34px;
      background:
        linear-gradient(90deg,transparent 0 97%,rgba(0,0,0,.055) 97% 100%),
        var(--panel);
      border-left:4px solid var(--ink);
      box-shadow:-10px 0 0 var(--pink),-14px 0 0 var(--ink);
    }

    /* masthead: cheap 90s flyer */
    #editor-panel h1{
      margin:0 0 5px;
      font-family:Helvetica,Arial,sans-serif;
      font-size:31px;
      line-height:.86;
      font-weight:900;
      letter-spacing:-2px;
      text-transform:uppercase;
      transform:scaleX(.92);
      transform-origin:left top;
      color:#fff;
      -webkit-text-stroke:2px var(--ink);
      text-shadow:3px 3px 0 var(--pink),5px 5px 0 var(--ink);
    }

    #editor-panel .sub{
      display:inline-block;
      margin:5px 0 13px;
      padding:4px 7px 3px;
      background:var(--acid);
      border:2px solid var(--ink);
      box-shadow:3px 3px 0 var(--ink);
      font:900 10px/1 Helvetica,Arial,sans-serif;
      text-transform:uppercase;
      letter-spacing:.06em;
      transform:rotate(-1deg);
    }

    .section{
      position:relative;
      border-top:3px solid var(--ink);
      padding-top:11px;
      margin-top:15px;
    }

    .section:nth-of-type(odd){transform:rotate(.08deg)}
    .section:nth-of-type(even){transform:rotate(-.08deg)}

    .section-title{
      display:inline-block;
      margin:-2px 0 9px;
      padding:4px 8px 3px;
      background:var(--ink);
      color:#fff;
      border:2px solid var(--ink);
      box-shadow:3px 3px 0 var(--pink);
      font:900 11px/.9 Helvetica,Arial,sans-serif;
      text-transform:uppercase;
      letter-spacing:-.02em;
      transform:rotate(-1deg);
    }

    .field{margin-bottom:8px}
    .field label{
      display:inline-block;
      margin:0 0 3px;
      padding:2px 4px;
      background:#fff;
      border:1px solid var(--ink);
      font:900 9px/1 Helvetica,Arial,sans-serif;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    .field input,.field textarea{
      width:100%;
      border:2px solid var(--ink);
      border-radius:0;
      padding:7px 8px;
      background:#fff;
      color:var(--ink);
      font:800 14px/1.05 Helvetica,Arial,sans-serif;
      letter-spacing:-.02em;
      outline:none;
      box-shadow:3px 3px 0 rgba(0,0,0,.14);
    }

    .field input:focus,.field textarea:focus{
      background:#fff46a;
      box-shadow:4px 4px 0 var(--pink);
    }

    .field textarea{min-height:56px;resize:vertical}
    .popup-grid{display:grid;grid-template-columns:94px 1fr;gap:5px}
    .logo-input input{font:800 10px/1 Helvetica,Arial,sans-serif;padding:5px}

    .hint{
      margin-top:10px;
      padding:8px;
      background:var(--pink);
      border:2px solid var(--ink);
      box-shadow:4px 4px 0 var(--ink);
      font:900 10px/1.15 Helvetica,Arial,sans-serif;
      text-transform:uppercase;
      transform:rotate(.6deg);
    }

    .control-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
    .control-button,.fix-button{
      appearance:none;
      border:2px solid var(--ink);
      border-radius:0;
      background:#fff;
      color:var(--ink);
      padding:11px 6px 9px;
      cursor:pointer;
      font:900 11px/.9 Helvetica,Arial,sans-serif;
      text-transform:uppercase;
      letter-spacing:-.03em;
      box-shadow:4px 4px 0 var(--ink);
      transition:none;
    }

    .control-button:nth-child(1){background:var(--acid);transform:rotate(-1deg)}
    .control-button:nth-child(2){background:var(--blue);transform:rotate(.7deg)}
    .control-button:nth-child(3){background:var(--pink);transform:rotate(-.5deg)}
    .control-button:hover,.fix-button:hover{
      transform:translate(2px,2px) rotate(0);
      box-shadow:2px 2px 0 var(--ink);
      filter:saturate(1.2) contrast(1.05);
    }

    .rec-status{
      margin-top:9px;
      padding:8px 9px 6px;
      background:var(--ink);
      color:#fff;
      border:2px solid var(--ink);
      box-shadow:4px 4px 0 var(--red);
      font:900 11px/1 Helvetica,Arial,sans-serif;
      text-transform:uppercase;
      letter-spacing:.03em;
    }

    .palette{display:flex;flex-wrap:wrap;gap:5px}
    .swatch{
      width:34px;height:34px;
      border:2px solid var(--ink);
      border-radius:0;
      cursor:pointer;
      padding:0;
      box-shadow:2px 2px 0 var(--ink);
    }
    .swatch:nth-child(odd){transform:rotate(-2deg)}
    .swatch:nth-child(even){transform:rotate(2deg)}
    .swatch:hover{transform:scale(1.28) rotate(0);z-index:2}

    .coords{
      display:inline-block;
      margin-top:0;
      padding:2px 4px;
      background:#fff;
      border:1px solid var(--ink);
      font:900 9px/1 Helvetica,Arial,sans-serif;
      opacity:.75;
      text-transform:uppercase;
    }

    .scale-row{
      display:grid;
      grid-template-columns:86px 1fr 44px;
      gap:6px;
      align-items:center;
      margin:7px 0;
      padding:4px;
      border:1px solid var(--ink);
      background:#fff;
    }
    .scale-row label{font:900 10px/1 Helvetica,Arial,sans-serif;text-transform:uppercase}
    .scale-row input[type=range]{width:100%;accent-color:var(--pink)}
    .scale-value{font:900 11px/1 Helvetica,Arial,sans-serif;text-align:right}

    .place-editor{
      border:2px solid var(--ink);
      background:#fff;
      padding:7px;
      margin-bottom:8px;
      box-shadow:4px 4px 0 var(--ink);
    }
    .place-editor:nth-child(odd){transform:rotate(-.35deg)}
    .place-editor:nth-child(even){transform:rotate(.35deg)}
    .place-grid{display:grid;grid-template-columns:1fr 70px;gap:6px}
    .place-grid .field{margin:0}
    .place-grid input{font-family:Helvetica,Arial,sans-serif;font-weight:900;font-size:12px}
    .place-grid .field:last-child input{text-align:center;font-size:24px;padding:2px 4px;height:36px}

    .place-actions{display:grid;grid-template-columns:2fr 1fr;gap:6px;margin-top:9px}
    .fix-button{background:var(--acid)}
    .fix-button.secondary{background:#fff}

    /* intentionally ugly browser-ish checkboxes */
    input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink)}

    #editor-panel::-webkit-scrollbar{width:14px}
    #editor-panel::-webkit-scrollbar-track{background:#fff;border-left:2px solid var(--ink)}
    #editor-panel::-webkit-scrollbar-thumb{background:var(--ink);border:3px solid #fff}

    @media (max-width:900px){
      #editor-panel{width:320px}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>
<body>
  <script src="engine.js"></script>
</body>
</html>
