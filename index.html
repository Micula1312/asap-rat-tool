<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EX CASA DEL CUSTODE — RAT MAP ENGINE</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #8D8D8A; }
    body { font-family: Helvetica, Arial, sans-serif; }
    canvas { display: block; position: fixed; inset: 0; z-index: 0; }

    #editor-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 360px;
      height: 100vh;
      z-index: 20;
      overflow-y: auto;
      padding: 18px;
      background: rgba(248,248,246,.98);
      border-left: 2px solid #0B0B0F;
      color: #0B0B0F;
    }
    #editor-panel h1 { margin: 0 0 4px; font: 700 17px/1.1 monospace; }
    #editor-panel .sub { margin: 0 0 18px; opacity: .55; font: 11px/1.3 monospace; }
    .section { border-top: 1px solid rgba(0,0,0,.18); padding-top: 14px; margin-top: 14px; }
    .section-title { margin-bottom: 9px; font: 700 12px/1 monospace; text-transform: uppercase; }
    .field { margin-bottom: 9px; }
    .field label { display: block; margin-bottom: 4px; font: 700 10px/1.2 monospace; opacity: .65; text-transform: uppercase; }
    .field input, .field textarea {
      width: 100%; border: 1px solid rgba(0,0,0,.35); border-radius: 0; padding: 8px;
      background: #fff; color: #111; font: 12px/1.25 monospace; outline: none;
    }
    .field textarea { min-height: 58px; resize: vertical; }
    .popup-grid { display: grid; grid-template-columns: 88px 1fr; gap: 7px; }
    .logo-input input { font-size: 10px; }
    .hint { font: 10px/1.35 monospace; opacity: .55; margin-top: 8px; }
    .coords { margin-top: 5px; font: 10px/1 monospace; opacity: .45; }

    .control-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
    .control-button {
      border: 1px solid #0B0B0F;
      background: #fff;
      color: #0B0B0F;
      padding: 11px 8px;
      cursor: pointer;
      font: 700 11px/1 monospace;
    }
    .control-button:hover { background:#FF78C8; }
    .rec-status {
      margin-top: 7px;
      padding: 7px 9px;
      background: #FF78C8;
      color: #0B0B0F;
      font: 700 10px/1 monospace;
      letter-spacing: .04em;
    }
    .palette { display:flex; flex-wrap:wrap; gap:7px; }
    .swatch {
      width:30px; height:30px; border:1px solid rgba(0,0,0,.3); padding:0; cursor:pointer;
    }
    .swatch:hover { outline:2px solid #0B0B0F; outline-offset:2px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
</head>
<body>
  <script src="engine.js"></script>
</body>
</html>
